<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI OFFICE — VELFONT OFFICE</title>
<meta name="description" content="MIDI OFFICE — a playable studio built with the Web Audio API: sequencer, synth, sampler, DJ decks, and a recorder, all in small draggable windows.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://velfontoffice.com/midi-office/">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.documentElement.classList.add("js-enter");
  }
</script>
</head>
<body class="midi-office">

<div class="tone-topbar">
  <a href="/" class="tone-exit">&larr; VELFONT OFFICE</a>
  <span class="tone-badge">MIDI OFFICE — A PLAYABLE STUDIO, BUILT WITH WEB AUDIO</span>
</div>

<!-- A searchable reference for every module, read live from
     js/modules.js — see js/help.js. -->
<button type="button" class="tone-help-btn" id="toneHelpBtn" aria-haspopup="true" aria-expanded="false" aria-controls="toneHelpPanel">HELP</button>
<div class="tone-help-panel" id="toneHelpPanel" hidden role="dialog" aria-modal="true" aria-label="Module help">
  <div class="tone-help-head">
    <input type="text" class="tone-help-search" id="toneHelpSearch" placeholder="Search modules…" autocomplete="off" spellcheck="false">
    <button type="button" class="tone-help-close" id="toneHelpClose" aria-label="Close help">&times;</button>
  </div>
  <div class="tone-help-list" id="toneHelpList"></div>
</div>

<main class="tone-main">
  <!-- Shared transport — every module locks to this clock/volume
       rather than keeping its own. Not a window itself (closing it
       would break everything downstream of it). -->
  <section class="tone-transport" aria-label="Transport">
    <button type="button" class="tone-play-btn" id="tonePlayBtn" aria-pressed="false">
      <span class="tone-play-icon" aria-hidden="true"></span>
      <span class="tone-play-label">PLAY</span>
    </button>

    <div class="tone-field tone-field-bpm">
      <label for="toneBpm">BPM</label>
      <input type="range" id="toneBpm" min="60" max="180" step="1" value="120">
      <span class="tone-field-value" id="toneBpmValue">120</span>
    </div>

    <button type="button" class="tone-tap-btn" id="toneTapBtn">TAP</button>

    <div class="tone-field tone-field-volume">
      <label for="toneMasterVolume">VOLUME</label>
      <input type="range" id="toneMasterVolume" min="0" max="100" step="1" value="70">
    </div>
  </section>

  <!-- Dock — one button per js/modules.js entry, each opening its own
       small window (js/window-manager.js), beta-office style. -->
  <section class="tone-dock" aria-label="Modules">
    <h1 class="tone-dock-title">MIDI OFFICE</h1>
    <p class="tone-dock-desc">A playable studio — open a module below, drag it where you want it.</p>
    <div class="tone-dock-buttons" id="toneDockButtons"></div>
  </section>
</main>

<!-- Every open module window lives here, stacked by js/window-manager.js. -->
<div class="tone-windows-layer" id="toneWindowsLayer"></div>
<div class="tone-taskbar" id="toneTaskbar" aria-label="Minimized windows"></div>

<script src="js/audio-engine.js" defer></script>
<script src="js/window-manager.js" defer></script>
<script src="js/sequencer.js" defer></script>
<script src="js/synth.js" defer></script>
<script src="js/delay.js" defer></script>
<script src="js/sampler.js" defer></script>
<script src="js/dj.js" defer></script>
<script src="js/ai-jam.js" defer></script>
<script src="js/recorder.js" defer></script>

<!-- EP-133 Workstation — see js/workstation/. Loaded in dependency
     order: storage has none; audio-engine depends on the existing
     js/audio-engine.js above; patterns/groups are pure data; projects
     ties storage+groups+patterns together; transport reads patterns'
     TICKS_PER_QUARTER at load time so it must come after; sequencer
     reads transport+patterns+groups at load time so it's last of the
     core; sampler/keyboard/ui/app only touch the others inside
     function bodies, so their relative order is flexible. -->
<script src="js/workstation/storage.js" defer></script>
<script src="js/workstation/audio-engine.js" defer></script>
<script src="js/workstation/patterns.js" defer></script>
<script src="js/workstation/groups.js" defer></script>
<script src="js/workstation/projects.js" defer></script>
<script src="js/workstation/transport.js" defer></script>
<script src="js/workstation/sequencer.js" defer></script>
<script src="js/workstation/sampler.js" defer></script>
<script src="js/workstation/keyboard.js" defer></script>
<script src="js/workstation/sound-editor.js" defer></script>
<script src="js/workstation/effects.js" defer></script>
<script src="js/workstation/mixer.js" defer></script>
<script src="js/workstation/keys-mode.js" defer></script>
<script src="js/workstation/midi.js" defer></script>
<script src="js/workstation/ui.js" defer></script>
<script src="js/workstation/app.js" defer></script>

<script src="js/modules.js" defer></script>
<script src="js/help.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
