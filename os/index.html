<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELFONT OS</title>
<link rel="canonical" href="https://velfontoffice.com/os/">
<link rel="stylesheet" href="css/login.css">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<script src="js/login.js" defer></script>
</head>
<body>
  <div id="flash" class="flash"></div>

  <div class="boot">
    <div class="curtain"></div>
    <a class="exit" href="/">exit</a>

    <div class="content">
      <div class="brand" id="brand">
        <div class="line line-1">VFO</div>
        <div class="line line-2">FOUNDER OS</div>
        <div class="dots" id="dots">
          <button class="member-dot red" type="button" data-member="rim"></button>
          <button class="member-dot green" type="button" data-member="rogi"></button>
          <button class="member-dot blue" type="button" data-member="seoh"></button>
        </div>
        <div class="passphrase-panel" id="passphrase-panel">
          <label for="passphrase" class="passphrase-label">PASSPHRASE</label>
          <div class="passphrase-input-wrap">
            <input id="passphrase" class="underline-input" type="password" autocomplete="off">
            <button class="passphrase-toggle" type="button" id="passphrase-toggle" aria-label="Show passphrase" aria-pressed="false">SHOW</button>
          </div>
          <div class="denied" id="denied">ACCESS DENIED</div>
          <button class="enter" type="button" id="enter-btn">ENTER</button>
        </div>
      </div>

      <div class="welcome-block" id="welcome-block">
        <div class="welcome-title">WELCOME</div>
        <div class="welcome-name" id="welcome-name"></div>
      </div>
    </div>
  </div>
</body>
</html>
