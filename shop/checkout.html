<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELFONT SHOP — Checkout</title>
<link rel="canonical" href="https://velfontoffice.com/shop/checkout.html">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<script>
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.documentElement.classList.add("js-enter");
  }
</script>
</head>
<body>

<div class="page-veil" aria-hidden="true"></div>

<header class="site-header">
  <div class="header-side header-left">
    <button class="nav-toggle" id="navToggle" data-i18n-aria-label="nav.menuOpen" aria-label="메뉴 열기">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <line class="nav-toggle-v" x1="10" y1="2" x2="10" y2="18"></line>
        <line x1="2" y1="10" x2="18" y2="10"></line>
      </svg>
    </button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="index.html">All</a></li>
      </ul>
    </nav>
  </div>

  <a href="/" class="logo" data-i18n-aria-label="nav.logoHome" aria-label="VELFONT OFFICE 홈으로 이동">
    <span class="logo-mark" role="img" aria-label="VELFONT OFFICE"></span>
  </a>

  <div class="header-side header-right"></div>
</header>

<nav class="breadcrumb">
  <a href="index.html">All</a> <span>/</span> <span>Checkout</span>
</nav>

<main class="checkout-page">
  <section class="checkout-summary">
    <h1 data-i18n="checkout.title">주문 요약</h1>
    <div class="checkout-items" id="checkoutItems"></div>
    <div class="checkout-total-row">
      <span data-i18n="checkout.totalLabel">총 결제 금액</span>
      <span id="checkoutTotal">0원</span>
    </div>
  </section>

  <section class="checkout-payment">
    <h2 data-i18n="checkout.paymentInfo">결제 정보</h2>
    <p class="checkout-note" data-i18n="checkout.note">결제 연동은 준비 중입니다. 아래 버튼은 이후 실제 PG(결제) 연동이 붙을 자리입니다.</p>

    <div class="checkout-field">
      <label for="recipientName" data-i18n="checkout.recipientLabel">받는 사람</label>
      <input type="text" id="recipientName" data-i18n-placeholder="checkout.recipientPlaceholder" placeholder="이름">
    </div>
    <div class="checkout-field">
      <label for="recipientAddress" data-i18n="checkout.addressLabel">배송지</label>
      <input type="text" id="recipientAddress" data-i18n-placeholder="checkout.addressPlaceholder" placeholder="주소">
    </div>
    <div class="checkout-field">
      <label for="recipientPhone" data-i18n="checkout.phoneLabel">연락처</label>
      <input type="text" id="recipientPhone" data-i18n-placeholder="checkout.phonePlaceholder" placeholder="휴대폰 번호">
    </div>

    <button class="checkout-submit-btn" id="checkoutSubmitBtn" data-i18n="checkout.submit">결제하기</button>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <p>&copy; 2026 VELFONT OFFICE. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/products.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
