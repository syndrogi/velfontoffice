<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TONE OFFICE — VELFONT OFFICE</title>
<meta name="description" content="TONE OFFICE — a playable step sequencer and synth, built entirely in the browser with the Web Audio API.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://velfontoffice.com/tone-office/">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="tone-office">

<div class="tone-topbar">
  <a href="/" class="tone-exit">&larr; VELFONT OFFICE</a>
  <span class="tone-badge">TONE OFFICE — A PLAYABLE STUDIO, BUILT WITH WEB AUDIO</span>
</div>

<!-- Everything below is silent until this fires once — browsers refuse
     to start an AudioContext before a user gesture, so the whole rack
     waits behind a single "ENTER" tap instead of silently doing nothing
     the first time someone hits play. -->
<div class="tone-gate" id="toneGate">
  <button type="button" class="tone-gate-btn" id="toneGateBtn">
    <span class="tone-gate-mark">&#9654;</span>
    ENTER TONE OFFICE
  </button>
  <p class="tone-gate-hint">Sound starts on tap — turn your volume up.</p>
</div>

<main class="tone-rack" id="toneRack" aria-hidden="true" inert>

  <!-- Transport — section 1: shared clock every module below locks to. -->
  <section class="tone-module tone-transport" aria-label="Transport">
    <button type="button" class="tone-play-btn" id="tonePlayBtn" aria-pressed="false">
      <span class="tone-play-icon" aria-hidden="true"></span>
      <span class="tone-play-label">PLAY</span>
    </button>

    <div class="tone-field tone-field-bpm">
      <label for="toneBpm">BPM</label>
      <input type="range" id="toneBpm" min="60" max="180" step="1" value="120">
      <span class="tone-field-value" id="toneBpmValue">120</span>
    </div>

    <button type="button" class="tone-tap-btn" id="toneTapBtn">TAP</button>

    <div class="tone-field tone-field-volume">
      <label for="toneMasterVolume">VOLUME</label>
      <input type="range" id="toneMasterVolume" min="0" max="100" step="1" value="70">
    </div>
  </section>

  <!-- Sequencer — section 2: 4 synthesized drum voices, 16 steps each. -->
  <section class="tone-module tone-sequencer" aria-label="Step sequencer">
    <h2 class="tone-module-title">SEQUENCER</h2>
    <div class="tone-seq-tracks" id="toneSeqTracks"></div>
  </section>

  <!-- Synth — section 3: the actually-playable part. Click/drag the keys
       or use the computer keyboard (row shown on the keys themselves). -->
  <section class="tone-module tone-synth" aria-label="Synth">
    <h2 class="tone-module-title">SYNTH</h2>

    <div class="tone-synth-controls">
      <div class="tone-field">
        <label for="toneWave">WAVE</label>
        <select id="toneWave" class="tone-select">
          <option value="sawtooth">SAW</option>
          <option value="square">SQUARE</option>
          <option value="triangle">TRIANGLE</option>
          <option value="sine">SINE</option>
        </select>
      </div>
      <div class="tone-field">
        <label for="toneCutoff">CUTOFF</label>
        <input type="range" id="toneCutoff" min="200" max="8000" step="1" value="2400">
      </div>
      <div class="tone-field">
        <label for="toneAttack">ATTACK</label>
        <input type="range" id="toneAttack" min="0" max="500" step="1" value="8">
      </div>
      <div class="tone-field">
        <label for="toneRelease">RELEASE</label>
        <input type="range" id="toneRelease" min="20" max="1500" step="1" value="220">
      </div>
      <button type="button" class="tone-toggle-btn" id="toneArpBtn" aria-pressed="false">ARP</button>
    </div>

    <div class="tone-keyboard" id="toneKeyboard"></div>
  </section>

  <!-- FX — section 4: one real-time effect on the synth's own output. -->
  <section class="tone-module tone-fx" aria-label="Delay effect">
    <h2 class="tone-module-title">DELAY</h2>
    <div class="tone-fx-controls">
      <div class="tone-field">
        <label for="toneDelayTime">TIME</label>
        <input type="range" id="toneDelayTime" min="0" max="800" step="1" value="260">
      </div>
      <div class="tone-field">
        <label for="toneDelayFeedback">FEEDBACK</label>
        <input type="range" id="toneDelayFeedback" min="0" max="85" step="1" value="35">
      </div>
      <div class="tone-field">
        <label for="toneDelayMix">MIX</label>
        <input type="range" id="toneDelayMix" min="0" max="100" step="1" value="25">
      </div>
    </div>
  </section>

</main>

<script src="js/audio-engine.js" defer></script>
<script src="js/sequencer.js" defer></script>
<script src="js/synth.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
